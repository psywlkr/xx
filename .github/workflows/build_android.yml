name: Build Android APKs

on: workflow_dispatch

# Minimal GITHUB_TOKEN permissions: read repo, write artifacts
permissions:
  contents: read

jobs:
  build_kivy_demo:
    name: "Build Android – Kivy BLE Demo"
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: pip install buildozer cython
      - name: Cache buildozer files
        uses: actions/cache@v4
        id: buildozer-cache
        with:
          path: |
            ~/.buildozer
            examples/kivy/.buildozer
          key: build-cache-buildozer
      - name: Clean bleak recipe for cache
        if: steps.buildozer-cache.outputs.cache-hit == 'true'
        working-directory: examples/kivy
        run: buildozer android p4a -- clean-recipe-build --local-recipes $(pwd)/../../bleak/backends/p4android/recipes bleak
      - name: Build Kivy example
        working-directory: examples/kivy
        run: buildozer android debug
      - name: Upload Kivy demo APK
        uses: actions/upload-artifact@v4
        with:
          name: ble-demo-debug-apk
          path: examples/kivy/bin/*.apk

  build_dashboard:
    name: "Build Android – BLE Dashboard"
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: pip install buildozer cython
      - name: Cache buildozer files
        uses: actions/cache@v4
        id: buildozer-cache
        with:
          path: |
            ~/.buildozer
            examples/dashboard/android/.buildozer
          key: build-cache-buildozer-dashboard-${{ hashFiles('examples/dashboard/android/buildozer.spec') }}
      - name: Clean bleak recipe for cache
        if: steps.buildozer-cache.outputs.cache-hit == 'true'
        working-directory: examples/dashboard/android
        run: buildozer android p4a -- clean-recipe-build --local-recipes $(pwd)/../../../bleak/backends/p4android/recipes bleak
      - name: Build BLE Dashboard APK
        working-directory: examples/dashboard/android
        run: buildozer android debug
      - name: Upload Dashboard APK
        uses: actions/upload-artifact@v4
        with:
          name: ble-dashboard-debug-apk
          path: examples/dashboard/android/bin/*.apk
